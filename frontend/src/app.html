<!doctype html>
<html lang="%lang%" data-theme="cisotheme">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
		<style>
			.scrollbar {
				overflow-y: scroll;
				scrollbar-color: #58b5ff transparent;
				scrollbar-width: thin;
			}

			.scrollbar::-webkit-scrollbar {
				margin-top: 22px;
				margin-bottom: 22px;
				width: 3px;
				height: 20px;
			}

			.scrollbar::-webkit-scrollbar-track {
				margin-top: 22px;
				margin-bottom: 22px;
				border-radius: 100vh;
				background: transparent;
			}

			.scrollbar::-webkit-scrollbar-thumb {
				margin-top: 22px;
				margin-bottom: 22px;
				background: #58b5ff;
				border-radius: 100vh;
				border: 10px solid #0b1f2a;
			}

			.scrollbar::-webkit-scrollbar-thumb:hover {
				background: #14c8b5;
			}
		</style>
	</head>

	<body data-sveltekit-preload-data="tap">
		<div style="display: contents" class="h-full overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
