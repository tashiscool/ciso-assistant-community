name: Cloudflare Workers Checks

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-workers-check.yml'
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-workers-check.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm --prefix cloudflare ci

      - name: Typecheck workers
        run: npm --prefix cloudflare run typecheck
