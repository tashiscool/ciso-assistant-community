schema_version: "1.0"
document:
  title: "Regovise Backend Mapping"
  environment: "production"
  canonical_origin: "https://regovise.com"
  generated_on: "2026-06-01"
  purpose: >
    Machine-readable backend map for the Regovise Cloudflare Worker, including
    service roots, route families, runtime bindings, data stores, queue workers,
    semantic module coverage, and production validation entry points.
  sources:
    router: "cloudflare/src/router.ts"
    worker_entrypoint: "cloudflare/src/index.ts"
    bindings: "cloudflare/wrangler.toml"
    env_types: "cloudflare/src/types/env.ts"
    authorization: "cloudflare/src/auth.ts, cloudflare/src/authorization.ts"
    services: "cloudflare/src/services/**"
    migrations: "cloudflare/migrations/*.sql"
    semantic_matrix: "cloudflare/scripts/semantic_gap_matrix.mjs"
    production_e2e: "cloudflare/scripts/prod_e2e_validation.mjs"
    semantic_contracts:
      - "cloudflare/docs/regovise_backend_mapping.yaml"
      - "backend/docs/ciso_assistant_python_backend_mapping.yaml"
      - "backend/docs/regscale_public_inferred_backend_mapping.yaml"

contract_alignment:
  source_of_truth:
    regovise_runtime: "cloudflare/docs/regovise_backend_mapping.yaml"
    ciso_assistant_semantics: "backend/docs/ciso_assistant_python_backend_mapping.yaml"
    regscale_public_semantics: "backend/docs/regscale_public_inferred_backend_mapping.yaml"
    checker: "cloudflare/scripts/semantic_gap_matrix.mjs"
  enforcement_summary:
    - "The semantic matrix now loads all three backend mapping YAML files."
    - "features/scale.md remains the hard tenant module inventory."
    - "RegScale public module domains are checked as extended semantic module coverage."
    - "CISO Assistant backend app/API domains are checked against concrete Regovise routes and Worker service roots."
    - "Builder, questionnaire, automation, AI/RegML, compliance, identity, and module-record minimum equivalents must resolve to tenant-facing Regovise routes plus real Worker APIs."
  tenant_access_rule: >
    Semantic parity routes should be gated by tenant capabilities such as modules,
    framework, risk, evidence, privacy, resilience, analytics, portal, chat, or
    workspace administration. They should not be hidden behind internal-only
    access when the route represents a current-app tenant feature.
  extended_semantic_contracts:
    regscale_public_module_domains:
      - "issues"
      - "requests"
      - "security-profiles"
      - "threat-models"
    ciso_assistant_semantic_routes:
      - "asset-assessments"
      - "auditee-assessments"
      - "calendar"
      - "dashboards"
      - "data-wizard/imports"
      - "doc-management"
      - "ebios-rm"
      - "evidences"
      - "metrology/analytics"
      - "pmbok/accreditations"
      - "privacy/processings"
      - "quantitative-risk"
      - "resilience/business-impact-analysis"
      - "serdes/backup-restore"
      - "task-nodes"
      - "vulnerabilities"
      - "webhooks/integrations"
    access_fix: >
      CISO/RegScale-equivalent tenant surfaces such as workflow, utilities,
      subsystems, RMF, app management, workbench, news feed, calendar,
      dashboards, vulnerability review, task operations, library mappings,
      requirement assessments, and quantitative-risk satellites now use domain
      capability gates instead of internalOnly gating. Backup/restore and
      license-management remain administrator-only because they affect tenant
      state or licensing.

runtime:
  platform: "Cloudflare Workers"
  worker_name:
    development: "ciso-assistant-edge"
    production: "ciso-assistant-edge-production"
  fetch_behavior:
    api_prefix: "/_api/"
    spa_assets: "All non-API requests are served from ASSETS with SPA fallback."
    cors: "Every API response is wrapped by withCors; OPTIONS uses corsPreflight."
    error_shape:
      typed: "{ error, message, details? }"
      untyped: "{ error: request_failed, message }"
  production_routes:
    - "regovise.com"
    - "www.regovise.com"
  production_vars:
    APP_ENV: "production"
    APP_ORIGIN: "https://regovise.com"
    EMAIL_PROVIDER: "mailchannels"
    EMAIL_FROM: "no-reply@regovise.com"
    EMAIL_FROM_NAME: "Regovise"
    EMAIL_DKIM_DOMAIN: "regovise.com"
    EMAIL_DKIM_SELECTOR: "mcdkim"

bindings:
  assets:
    ASSETS:
      type: "Cloudflare Workers Assets"
      source_directory: "apps/web/dist"
      html_handling: "auto-trailing-slash"
      not_found_handling: "single-page-application"
  d1:
    D1_MAIN:
      database_name: "ciso-assistant-d1"
      database_id: "d14a0f7a-6158-4ea3-9622-e735417fb51e"
      migrations_dir: "cloudflare/migrations"
  r2:
    R2_EVIDENCE:
      bucket_name: "ciso-assistant-evidence"
      preview_bucket_name: "ciso-assistant-evidence-preview"
      primary_uses:
        - "evidence artifacts"
        - "assurance bundles"
        - "agent traces and generated artifacts"
  vectorize:
    EVIDENCE_VECTOR_INDEX:
      index_name: "ciso-assistant-evidence-index"
      production_only: true
      fallback_behavior: "AI/vector search paths label deterministic fallback when Vectorize or AI is unavailable."
  ai:
    AI:
      type: "Cloudflare AI binding"
      production_only: true
  durable_objects:
    TENANT_WORKFLOW_COORDINATOR:
      class: "TenantWorkflowCoordinator"
      source: "cloudflare/src/durable-objects/TenantWorkflowCoordinator.ts"
      purpose: "Tenant workflow heartbeat, lease, and run-state coordination."
  queues:
    QUEUE_EVIDENCE_JOBS:
      queue: "ciso-assistant-evidence-jobs"
      consumer: "cloudflare/src/queues/evidence.ts"
      message_type: "evidence.job.run"
      max_batch_size: 5
      max_retries: 3
    QUEUE_CONMON_JOBS:
      queue: "ciso-assistant-conmon-jobs"
      consumer: "cloudflare/src/queues/conmon.ts"
      message_type: "conmon.execution.run"
      max_batch_size: 5
      max_retries: 3
    QUEUE_GRC_CONTENT_IMPORT:
      queue: "ciso-assistant-grc-content-import"
      consumer: "cloudflare/src/queues/grc.ts"
      message_type: "grc.content.import"
      max_batch_size: 2
      max_retries: 3
    QUEUE_GRC_SCF_REFRESH:
      queue: "ciso-assistant-grc-scf-refresh"
      consumer: "cloudflare/src/queues/grc.ts"
      message_type: "grc.scf.refresh"
      max_batch_size: 2
      max_retries: 3
    QUEUE_GRC_FINDING_INGEST:
      queue: "ciso-assistant-grc-finding-ingest"
      consumer: "cloudflare/src/queues/grc.ts"
      message_type: "grc.finding.ingest"
      max_batch_size: 5
      max_retries: 3
    QUEUE_GRC_GAP_REPORT:
      queue: "ciso-assistant-grc-gap-report"
      consumer: "cloudflare/src/queues/grc.ts"
      message_type: "grc.gap.report"
      max_batch_size: 2
      max_retries: 3
    QUEUE_GRC_AI_ENRICH:
      queue: "ciso-assistant-grc-ai-enrich"
      consumer: "cloudflare/src/queues/grc.ts"
      message_type: "grc.ai.enrich"
      max_batch_size: 2
      max_retries: 3
  secrets:
    BOOTSTRAP_SETUP_SECRET:
      purpose: "Guarded bootstrap admin/session recovery and production validation."
      committed: false
    OIDC_CLIENT_SECRET:
      purpose: "Generic OIDC client secret fallback."
      committed: false
    SSO_OIDC_CLIENT_SECRET:
      purpose: "SSO OIDC client secret."
      committed: false
    GOOGLE_OIDC_CLIENT_SECRET:
      purpose: "Google Workspace OIDC client secret."
      committed: false
    GOOGLE_CLIENT_SECRET:
      purpose: "Alternate Google client secret."
      committed: false
    OPENAI_API_KEY:
      purpose: "Optional OpenAI-compatible backend for AI features."
      committed: false
    OPENAI_API_BASE_URL:
      purpose: "Optional OpenAI-compatible endpoint override."
      committed: false

auth_and_authorization:
  auth_pipeline:
    source: "cloudflare/src/auth.ts"
    order:
      - "D1 session cookie lookup via ca_session or session_id."
      - "Header auth only outside production, except /_api/core/session/exchange."
      - "Anonymous context when no valid session/header auth exists."
  session:
    table: "sessions"
    cookie_name: "ca_session"
    legacy_cookie_name: "session_id"
    create_session_source: "cloudflare/src/session.ts"
  sso:
    config_table: "setup_sso_configs"
    transaction_table: "sso_auth_transactions"
    runtime_source: "cloudflare/src/services/core/oidc.ts"
    callback_flow_source: "cloudflare/src/services/core/http.ts"
    supported_protocols:
      - "none"
      - "oidc"
      - "saml"
      - "cloudflare-access"
    notes:
      - "Google Workspace OIDC is used by fedhr."
      - "JIT provisioning is supported when enabled by tenant setup."
      - "Role sync depends on configured group/role claims and matching Regovise role names."
  permissions:
    source: "cloudflare/src/authorization.ts"
    model:
      folders: "Domain/root scope hierarchy."
      roles: "Role catalog with role_permissions."
      assignments: "User or group role assignments scoped to folders."
      scoped_context: "loadScopedPermissionContext computes accessible folders/domains for requested permissions."
    tenant_admin_permissions:
      - "add_user"
      - "change_user"
      - "delete_user"
      - "add_role"
      - "change_role"
      - "delete_role"

