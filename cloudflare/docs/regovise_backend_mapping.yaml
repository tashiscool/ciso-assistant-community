    production_http: "npm --prefix cloudflare run smoke:production"
    production_modules: "npm --prefix cloudflare run smoke:production:modules"
    production_playwright: "npm --prefix cloudflare run smoke:production:playwright"
    production_e2e: "npm --prefix cloudflare run smoke:production:e2e"
