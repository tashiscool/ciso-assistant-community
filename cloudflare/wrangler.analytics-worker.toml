name = "ciso-analytics-worker"
main = "src/analytics-worker.ts"
compatibility_date = "2026-03-05"

[vars]
HOT_RETENTION_DAYS = "30"
WARM_RETENTION_DAYS = "180"
COLD_RETENTION_DAYS = "730"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "CISO_ANALYTICS_R2"
bucket_name = "ciso-analytics-raw-r2"

[[queues.consumers]]
queue = "events-q"
max_batch_size = 100
max_batch_timeout = 10

[[queues.producers]]
binding = "DEAD_LETTER_Q"
queue = "dead-letter-q"

[[durable_objects.bindings]]
name = "ANALYTICS_AGGREGATOR"
class_name = "AnalyticsAggregateDurableObject"

[[migrations]]
tag = "analytics-v1"
new_sqlite_classes = ["AnalyticsAggregateDurableObject"]

[triggers]
crons = ["15 3 * * *"]
