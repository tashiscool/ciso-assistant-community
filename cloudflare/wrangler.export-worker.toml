name = "ciso-export-worker"
main = "src/export-worker.ts"
compatibility_date = "2026-03-05"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "CISO_EXPORTS_R2"
bucket_name = "ciso-exports-r2"

[[r2_buckets]]
binding = "CISO_SNAPSHOTS_R2"
bucket_name = "ciso-snapshots-r2"

[[queues.consumers]]
queue = "exports-q"
max_batch_size = 20
max_batch_timeout = 10

[[queues.producers]]
binding = "PROJECTIONS_Q"
queue = "projections-q"

[[queues.producers]]
binding = "DEAD_LETTER_Q"
queue = "dead-letter-q"
