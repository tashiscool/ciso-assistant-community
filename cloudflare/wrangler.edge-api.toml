name = "ciso-edge-api-worker"
main = "src/edge-api-worker.ts"
compatibility_date = "2026-03-05"

[vars]
FILE_URL_SIGNING_SECRET = "change-me-in-cloudflare-secrets"
DEFAULT_READ_LIMIT = "100"
MAX_READ_LIMIT = "500"
MAX_INLINE_PAYLOAD_BYTES = "8192"
CISO_ADMIN_TOKEN = "change-me-admin-token"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "CISO_EVIDENCE_R2"
bucket_name = "ciso-evidence-r2"

[[r2_buckets]]
binding = "CISO_IMPORTS_R2"
bucket_name = "ciso-imports-r2"

[[r2_buckets]]
binding = "CISO_EXPORTS_R2"
bucket_name = "ciso-exports-r2"

[[r2_buckets]]
binding = "CISO_SNAPSHOTS_R2"
bucket_name = "ciso-snapshots-r2"

[[r2_buckets]]
binding = "CISO_ANALYTICS_R2"
bucket_name = "ciso-analytics-raw-r2"

[[queues.producers]]
binding = "COMMANDS_Q"
queue = "commands-q"

[[queues.producers]]
binding = "EVENTS_Q"
queue = "events-q"

[[queues.producers]]
binding = "EXPORTS_Q"
queue = "exports-q"
