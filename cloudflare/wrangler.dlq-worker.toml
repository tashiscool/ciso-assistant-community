name = "ciso-dlq-worker"
main = "src/dlq-worker.ts"
compatibility_date = "2026-03-05"

[vars]
DLQ_MAX_RETRIES = "3"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[queues.consumers]]
queue = "dead-letter-q"
max_batch_size = 50
max_batch_timeout = 15

[[queues.producers]]
binding = "COMMANDS_Q"
queue = "commands-q"

[[queues.producers]]
binding = "EVENTS_Q"
queue = "events-q"

[[queues.producers]]
binding = "PROJECTIONS_Q"
queue = "projections-q"

[[queues.producers]]
binding = "EXPORTS_Q"
queue = "exports-q"

[triggers]
crons = ["*/30 * * * *"]
