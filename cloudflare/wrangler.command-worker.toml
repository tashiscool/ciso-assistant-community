name = "ciso-command-worker"
main = "src/command-worker.ts"
compatibility_date = "2026-03-05"

[vars]
MAX_INLINE_EVENT_BYTES = "8192"
MAX_INLINE_PARITY_BYTES = "24576"
MAX_PARITY_INDEX_FIELDS = "256"
STRICT_FIELD_PARITY = "true"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "CISO_EVIDENCE_R2"
bucket_name = "ciso-evidence-r2"

[[r2_buckets]]
binding = "CISO_IMPORTS_R2"
bucket_name = "ciso-imports-r2"

[[r2_buckets]]
binding = "CISO_EXPORTS_R2"
bucket_name = "ciso-exports-r2"

[[r2_buckets]]
binding = "CISO_SNAPSHOTS_R2"
bucket_name = "ciso-snapshots-r2"

[[queues.consumers]]
queue = "commands-q"
max_batch_size = 50
max_batch_timeout = 10

[[queues.producers]]
binding = "EVENTS_Q"
queue = "events-q"

[[queues.producers]]
binding = "PROJECTIONS_Q"
queue = "projections-q"

[[queues.producers]]
binding = "EXPORTS_Q"
queue = "exports-q"

[[queues.producers]]
binding = "DEAD_LETTER_Q"
queue = "dead-letter-q"

# Sweep pending outbox entries every 2 minutes
[triggers]
crons = ["*/2 * * * *"]
