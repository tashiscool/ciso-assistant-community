name = "ciso-projection-worker"
main = "src/projection-worker.ts"
compatibility_date = "2026-03-05"

[[d1_databases]]
binding = "APP_D1_MAIN"
database_name = "app_d1_main"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[queues.consumers]]
queue = "projections-q"
max_batch_size = 100
max_batch_timeout = 10

[[queues.producers]]
binding = "DEAD_LETTER_Q"
queue = "dead-letter-q"
