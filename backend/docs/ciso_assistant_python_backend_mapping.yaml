        model: "tprm.Entity"
      - route: "entity-assessments"
        viewset: "EntityAssessmentViewSet"
        model: "tprm.EntityAssessment"
      - route: "solutions"
        viewset: "SolutionViewSet"
        model: "tprm.Solution"
      - route: "representatives"
