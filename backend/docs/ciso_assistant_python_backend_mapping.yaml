      - path: "iam/"
        include: "iam.urls"
      - path: "serdes/"
        include: "serdes.urls"
      - path: "data-wizard/"
        include: "data_wizard.urls"
      - path: "settings/"
        include: "global_settings.urls"
      - path: "chat/"
        include: "chat.urls"
      - path: "ebios-rm/"
        include: "ebios_rm.urls"
      - path: ""
        include: "doc_management.urls"
      - path: "privacy/"
        include: "privacy.urls"
      - path: "resilience/"
        include: "resilience.urls"
      - path: "crq/"
        include: "crq.urls"
      - path: "pmbok/"
        include: "pmbok.urls"
      - path: "metrology/"
        include: "metrology.urls"
      - path: "accounts/oidc/"
        include: "iam.sso.oidc.urls"
      - path: "accounts/saml/"
        include: "iam.sso.saml.urls"
      - path: "accounts/"
        include: "allauth.urls"
      - path: "_allauth/"
        include: "allauth.headless.urls"
      - path: ""
        include: "enterprise_core.urls"
        enabled_by: "enterprise MODULES dynamic include"
    direct_endpoints:
      - "user-preferences/"
      - "csrf/"
      - "health/"
      - "build/"
      - "evidences/<uuid:pk>/upload/"
      - "evidence-revisions/<uuid:pk>/upload/"
      - "get_counters/"
      - "get_metrics/"
      - "get_audits_metrics/"
      - "get_combined_assessments_status/"
      - "get_governance_calendar_data/"
      - "agg_data/"
      - "composer_data/"
      - "i18n/"
      - "requirement-assessments/<uuid:pk>/suggestions/applied-controls/"
      - "compliance-assessments/<uuid:pk>/suggestions/applied-controls/"
      - "compliance-assessments/<uuid:pk>/action-plan/"
      - "compliance-assessments/<uuid:pk>/action-plan/budget-overview/"
      - "compliance-assessments/<uuid:pk>/evidences-list/"
      - "risk-assessments/<uuid:pk>/action-plan/"
      - "risk-assessments/<uuid:pk>/action-plan/budget-overview/"
      - "mapping-libraries/"
      - "folders/<uuid:pk>/users/"
      - "search/"
      - "quick-start/"
      - "content-types/"
      - "task-nodes/<uuid:pk>/evidences/"
