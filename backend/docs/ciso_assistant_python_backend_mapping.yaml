schema_version: "1.0"
document:
  title: "CISO Assistant Community Python Backend Mapping"
  repository: "ciso-assistant-community"
  generated_on: "2026-06-01"
  purpose: >
    Machine-readable map of the Python backend surfaces in ciso-assistant-community,
    including the Django REST API, data model, authentication and authorization,
    background jobs, storage, enterprise overlay, automation sidecars, dispatcher,
    CLI/MCP tooling, management commands, and validation entry points.
  scope:
    primary_backend: "backend/"
    enterprise_overlay: "enterprise/backend/"
    python_sidecars:
      - "automation/"
      - "dispatcher/"
      - "cli/"
      - "tools/"
      - "config/"
    excludes:
      - "frontend runtime implementation details"
      - "Cloudflare Regovise Worker implementation details"
  authoritative_sources:
    django_settings: "backend/ciso_assistant/settings.py"
    django_root_urls: "backend/ciso_assistant/urls.py"
    django_core_urls: "backend/core/urls.py"
    django_apps: "backend/*/apps.py"
    django_models: "backend/*/models.py"
    django_serializers: "backend/*/serializers.py"
    django_views: "backend/*/views.py"
    django_tasks: "backend/*/tasks.py"
    migrations: "backend/*/migrations/*.py"
    enterprise_settings: "enterprise/backend/enterprise_core/settings.py"
    enterprise_urls: "enterprise/backend/enterprise_core/urls.py"
    enterprise_models: "enterprise/backend/enterprise_core/models.py"
    docker_runtime: "backend/Dockerfile, docker-compose.yml, config/docker-compose-barebone.yml"
    dispatcher: "dispatcher/"
    cli_mcp: "cli/"
    automation: "automation/"

runtime:
  primary_framework: "Django"
  api_framework: "Django REST Framework"
  schema_generator: "drf-spectacular"
  auth_packages:
    - "django-rest-knox"
    - "django-allauth"
    - "allauth.headless"
    - "allauth.mfa"
    - "allauth.socialaccount.providers.saml"
    - "allauth.socialaccount.providers.openid_connect"
  background_jobs: "Huey via huey.contrib.djhuey"
  audit: "django-auditlog plus core.custom_middleware.AuditlogMiddleware"
  structured_logging: "django-structlog / structlog"
  file_storage:
    default: "local filesystem at LOCAL_STORAGE_DIRECTORY / MEDIA_ROOT"
    optional: "S3-compatible storage via django-storages S3Boto3Storage when USE_S3=true"
  vector_search:
    qdrant: "Used by chat/RAG when ENABLE_CHAT=true and QDRANT_URL is configured."
  llm_backends:
    chat_mode:
      enabled_by: "ENABLE_CHAT=true plus chat_mode feature flag"
      supported:
        - "Ollama"
        - "OpenAI-compatible local servers such as LM Studio, MLX, vLLM, llama.cpp"
        - "sentence-transformers embeddings fallback"
  python_targets:
    backend: ">=3.14,<3.15"
    enterprise_backend: "^3.14"
    automation: ">=3.12"
    dispatcher: ">=3.11,<4.0"
    cli: ">=3.12"
  server_entrypoints:
    manage_py: "backend/manage.py"
    wsgi: "backend/ciso_assistant/wsgi.py"
    asgi: "backend/ciso_assistant/asgi.py"
    container_entrypoint: "backend/startup.sh via backend/Dockerfile"
    huey_worker: "python manage.py run_huey -w 2 --scheduler-interval 60"
  docker:
    backend_image_source: "backend/Dockerfile"
    backend_port: 8000
    frontend_port: 3000
    tls_reverse_proxy: "Caddy in docker-compose.yml"
    healthcheck: "GET /api/health/"

configuration:
  core_settings:
    DJANGO_SETTINGS_MODULE: "ciso_assistant.settings"
    ROOT_URLCONF: "ciso_assistant.urls"
    CISO_ASSISTANT_URL: "frontend/public origin; default http://localhost:5173"
    ALLOWED_HOSTS: "comma-separated host list; default localhost,127.0.0.1,host.docker.internal"
    CSRF_TRUSTED_ORIGINS: "derived from CISO_ASSISTANT_URL"
    DJANGO_SECRET_KEY: "secret key override; random generated fallback"
    DJANGO_DEBUG: "enables browsable API, staticfiles, SessionAuthentication, debug-only routes"
    CISO_ASSISTANT_VERSION: "runtime version metadata"
    CISO_ASSISTANT_BUILD: "runtime build metadata"
    FORCE_CREATE_ADMIN: "startup/admin creation behavior"
  logging:
    LOG_LEVEL: "default WARNING"
    LOG_FORMAT: "plain or json"
    LOG_OUTFILE: "optional ciso-assistant.log JSON file handler"
    DB_LOG: "enables database logging path"
  database:
    default_sqlite:
      engine: "django.db.backends.sqlite3"
      env: "SQLITE_FILE"
      default_path: "backend/db/ciso-assistant.sqlite3"
      test_path: "backend/db/test_ciso-assistant.sqlite3"
      pragmas:
        - "journal_mode=WAL"
        - "synchronous=NORMAL"
        - "transaction_mode=IMMEDIATE"
    postgres:
      enabled_when: "POSTGRES_NAME is set"
      engine: "django.db.backends.postgresql_psycopg2"
      env:
        - "POSTGRES_NAME"
        - "POSTGRES_USER"
        - "POSTGRES_PASSWORD"
        - "DB_HOST"
        - "DB_PORT"
        - "CONN_MAX_AGE"
        - "POSTGRES_SSL_MODE"
  storage:
    local:
      LOCAL_STORAGE_DIRECTORY: "default backend/db/attachments"
      ATTACHMENT_MAX_SIZE_MB: "default 25"
    s3:
      enabled_when: "USE_S3=true"
      backend: "storages.backends.s3boto3.S3Boto3Storage"
      credential_modes:
        - "AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY"
        - "AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN for IRSA"
      env:
        - "AWS_STORAGE_BUCKET_NAME"
        - "AWS_S3_ENDPOINT_URL"
        - "AWS_S3_REGION_NAME"
        - "AWS_LOCATION"
        - "AWS_S3_FILE_OVERWRITE=false"
  email:
    primary_smtp:
      - "DEFAULT_FROM_EMAIL"
      - "EMAIL_HOST"
      - "EMAIL_PORT"
      - "EMAIL_HOST_USER"
      - "EMAIL_HOST_PASSWORD"
      - "EMAIL_USE_TLS"
      - "EMAIL_USE_SSL"
    rescue_smtp:
      - "EMAIL_HOST_RESCUE"
      - "EMAIL_PORT_RESCUE"
      - "EMAIL_HOST_USER_RESCUE"
      - "EMAIL_HOST_PASSWORD_RESCUE"
      - "EMAIL_USE_TLS_RESCUE"
      - "EMAIL_USE_SSL_RESCUE"
    safety:
      - "EMAIL_USE_TLS and EMAIL_USE_SSL are mutually exclusive."
      - "EMAIL_FORCE_TLS_1_2 can pin SMTP TLS to TLS 1.2."
      - "MAIL_DEBUG=true uses console email backend."
  auth_tokens:
    AUTH_TOKEN_TTL: "default 60 minutes"
    AUTH_TOKEN_AUTO_REFRESH: "default true"
    AUTH_TOKEN_AUTO_REFRESH_MAX_TTL: "default 10 hours"
    KNOX_TOKEN_MODEL: "knox.AuthToken"
  huey:
    HUEY_FILE_PATH: "default backend/db/huey.db"
    class: "huey.SqliteHuey"
    name: "ciso_assistant"
    utc: true
    results: true
    immediate: false
  feature_flags:
    ENABLE_CHAT: "enables chat feature flag, chat settings, signals, and chat API runtime behavior"
    ENABLE_SANDBOX: "enables bubblewrap isolation for sensitive processing paths"
    WEBHOOK_ALLOW_PRIVATE_IPS: "allows private IP webhook delivery targets when true"
  enterprise:
    settings_module: "enterprise/backend/enterprise_core/settings.py"
    license_env:
      - "LICENSE_SEATS"
      - "LICENSE_EXPIRATION"
    dynamic_routes:
      - "client-settings"
      - "custom-email-templates"
      - "custom-word-templates"

django_rest_framework:
  default_renderers:
    - "JSONRenderer"
    - "BrowsableAPIRenderer only in DEBUG"
  default_authentication:
    - "knox.auth.TokenAuthentication"
    - "SessionAuthentication only in DEBUG"
  default_permissions:
    - "IsAuthenticated"
    - "core.permissions.RBACPermissions"
    - "enterprise_core.permissions.LicensePermission in enterprise build"
  default_filter_backends:
    - "django_filters.rest_framework.DjangoFilterBackend"
  default_pagination: "core.pagination.CustomLimitOffsetPagination"
  schema_class: "drf_spectacular.openapi.AutoSchema"
  exception_handler: "core.helpers.handle"

authentication_and_authorization:
  identity_model: "iam.User"
  login_methods:
    local_password: "/api/iam/login/"
    knox_logout: "/api/iam/logout/"
    knox_logout_all: "/api/iam/logoutall/"
    personal_access_tokens: "/api/iam/auth-tokens/"
    headless_allauth: "/api/_allauth/"
    oidc: "/api/accounts/oidc/"
    saml: "/api/accounts/saml/"
    session_token_exchange: "/api/iam/session-token/"
  sso:
    providers:
      - "SAML"
      - "OpenID Connect"
    adapters:
      account: "iam.adapter.AccountAdapter"
      social_account: "iam.adapter.SocialAccountAdapter"
    headless_token_strategy: "iam.utils.KnoxTokenStrategy"
  authorization_model:
    root_folder: "iam.Folder with content_type=GL"
    domain_folder: "iam.Folder with content_type=DO"
    enclave_folder: "iam.Folder with content_type=EN"
    role_catalog: "iam.Role"
    role_assignment: "iam.RoleAssignment"
    group_membership: "iam.UserGroup"
    object_scope: "Folder.get_folder(obj) resolves object-to-folder ownership"
    object_permissions: "core.permissions.RBACPermissions maps HTTP verbs to Django model permissions"
    published_visibility: "is_published objects use RoleAssignment.is_object_readable for safe read access"
    cache_layer:
      source: "backend/iam/cache_builders.py"
      caches:
        - "folders"
        - "roles"
        - "user_groups"
        - "role_assignments"
  permission_apps:
    - "core"
    - "ebios_rm"
    - "tprm"
    - "privacy"
    - "resilience"
    - "crq"
    - "pmbok"
    - "iam"
    - "global_settings"
  ignored_permission_models:
    - "personalaccesstoken"
    - "role"
    - "roleassignment"
    - "usergroup"
    - "ssosettings"
    - "historicalmetric"

top_level_urls:
  source: "backend/ciso_assistant/urls.py"
  routes:
    - path: "/api/webhooks/"
      include: "webhooks.urls"
    - path: "/api/schema/"
      view: "SpectacularAPIView"
    - path: "/api/schema/swagger/"
      view: "SpectacularSwaggerView"
    - path: "/api/schema/redoc/"
      view: "SpectacularRedocView"
    - path: "/api/integrations/"
      include: "integrations.urls"
      namespace: "integrations"
    - path: "/api/"
      include: "core.urls"
    - path: "/serdes/"
      include: "serdes.urls"
      note: "Non-api compatibility route, duplicated under /api/serdes/ by core.urls."
    - path: "/i18n/"
      include: "django.conf.urls.i18n"

api_map:
  core:
    base_path: "/api/"
    source: "backend/core/urls.py"
    purpose: "Main GRC, IAM include bridge, assessment, risk, evidence, library, tasks, incidents, search, metrics, imports, and module includes."
    router_viewsets:
      - route: "folders"
        viewset: "FolderViewSet"
        model: "iam.Folder"
      - route: "entities"
