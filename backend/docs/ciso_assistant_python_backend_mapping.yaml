      - "logout/"
      - "logoutall/"
      - "current-user/"
      - "change-password/"
      - "password-reset/"
      - "password-reset/confirm/"
      - "set-password/"
      - "revoke-sessions/"
      - "sso/"
      - "session-token/"
      - "auth-tokens/"
      - "auth-tokens/<str:pk>/"
  settings:
    base_path: "/api/settings/"
    source: "backend/global_settings/urls.py"
    router_viewsets:
      - "global -> GlobalSettingsViewSet"
      - "sso -> SSOSettingsViewSet"
      - "general -> GeneralSettingsViewSet"
      - "feature-flags -> FeatureFlagsViewSet"
    direct_endpoints:
      - "sso/info/"
      - "general/default-language/"
  webhooks:
    base_path: "/api/webhooks/"
    source: "backend/webhooks/urls.py"
    router_viewsets:
      - "endpoints -> WebhookEndpointViewSet"
    direct_endpoints:
      - "event-types/"
  integrations:
    base_path: "/api/integrations/"
    source: "backend/integrations/urls.py"
    namespace: "integrations"
    router_viewsets:
      - "configs -> IntegrationConfigurationViewSet"
    direct_endpoints:
      - "providers/"
      - "test-connection/"
      - "webhook/<uuid:config_id>/"
      - "sync-mappings/<uuid:pk>/"
  serdes:
