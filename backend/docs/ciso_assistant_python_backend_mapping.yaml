      - "PublishInRootFolderMixin"
      - "FilteringLabelMixin"
    notes:
      - "Most domain objects carry a folder field directly or through an assessment/perimeter/entity parent."
      - "RoleAssignment.perimeter_folders controls recursive domain/enclave access."
  assessment_inheritance:
    abstract_base: "core.Assessment"
