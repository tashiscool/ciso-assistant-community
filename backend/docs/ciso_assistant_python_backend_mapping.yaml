  metrics:
    endpoints:
      - "/api/get_metrics/"
      - "/api/get_audits_metrics/"
      - "/api/metrology/*"
    management_command: "metrics_server"
    dependency: "prometheus-client"
  webhook_safety:
    outbound_delivery_task: "webhooks.tasks.send_webhook_request"
    private_ip_guard: "WEBHOOK_ALLOW_PRIVATE_IPS"
  sandboxing:
    enabled_by: "ENABLE_SANDBOX=true"
    dependency: "bubblewrap installed in backend Dockerfile"
  password_hashers:
