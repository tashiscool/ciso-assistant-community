background_processing:
  huey:
    config: "backend/ciso_assistant/settings.py#HUEY"
    worker_command: "python manage.py run_huey -w 2 --scheduler-interval 60"
    task_modules:
      core:
        source: "backend/core/tasks.py"
        periodic:
          - "check_controls_with_expired_eta @ 06:00"
          - "check_compliance_assessments_due_in_month @ 06:05"
          - "check_compliance_assessments_due_in_week @ 06:10"
          - "check_compliance_assessments_due_tomorrow @ 06:15"
          - "check_applied_controls_expiring_in_month @ 06:17"
          - "check_applied_controls_expiring_in_week @ 06:20"
          - "check_applied_controls_expiring_tomorrow @ 06:25"
          - "check_evidences_expiring_in_month @ 06:27"
          - "check_evidences_expiring_in_week @ 06:30"
          - "check_evidences_expiring_tomorrow @ 06:35"
          - "check_evidences_expired @ 06:40"
          - "check_validation_flows_deadline_in_month @ 06:37"
          - "check_validation_flows_deadline_in_week @ 06:40"
          - "check_validation_flows_deadline_tomorrow @ 06:45"
          - "check_task_nodes_due_in_month @ 06:55"
          - "check_task_nodes_due_in_week @ 07:00"
          - "check_task_nodes_due_tomorrow @ 07:05"
          - "check_task_nodes_overdue @ 07:10"
          - "check_expired_organisation_issues @ 06:50"
          - "auditlog_retention_cleanup @ 22:30"
          - "auditlog_prune @ every 3 hours"
          - "lock_overdue_compliance_assessments @ 02:30"
          - "auto_sync_assessments @ 02:45"
          - "deactivate_expired_users @ 03:00"
          - "mark_expired_evidences @ 03:35"
        async:
          - "send_task_node_due_soon_notification"
          - "send_task_node_overdue_notification"
          - "send_notification_email_expired_eta"
          - "send_notification_email"
          - "send_applied_control_assignment_notification"
          - "send_task_template_assignment_notification"
          - "send_compliance_assessment_assignment_notification"
          - "send_risk_scenario_assignment_notification"
          - "send_compliance_assessment_due_soon_notification"
          - "send_applied_control_expiring_soon_notification"
          - "send_notification_email_expired_evidence"
          - "send_evidence_expiring_soon_notification"
          - "send_validation_flow_created_notification"
          - "send_validation_flow_updated_notification"
          - "send_validation_deadline_notification"
          - "send_assignment_activated_notification"
          - "send_assignment_submitted_notification"
          - "send_assignment_reviewed_notification"
      chat:
        source: "backend/chat/tasks.py"
        tasks:
          - "ingest_document"
          - "index_model_object"
          - "remove_model_object"
          - "index_library_knowledge_base"
      integrations:
        source: "backend/integrations/tasks.py"
        tasks:
          - "sync_object_to_integrations"
          - "process_webhook_event"
      metrology:
        source: "backend/metrology/tasks.py"
        periodic:
          - "check_realtime_metric_staleness @ every 15 minutes"
          - "check_hourly_metric_staleness @ minute 5"
          - "check_daily_and_longer_metric_staleness @ 04:00"
          - "cleanup_old_builtin_metric_samples @ 03:45"
      webhooks:
        source: "backend/webhooks/tasks.py"
        tasks:
          - "send_webhook_request with retries=5, retry_delay=60, retry_backoff=2.0"
  signals:
    auditlog_user_info:
      source: "backend/core/custom_middleware.py"
      behavior: "post_save on LogEntry enriches audit log with user/folder info."
    chat_indexing:
      source: "backend/chat/signals.py"
      enabled_by: "ENABLE_CHAT=true"
      behavior: "post_save/post_delete hooks queue incremental RAG indexing for selected models and evidence revisions."
    startup_post_migrate:
      sources:
        - "backend/core/apps.py"
        - "backend/global_settings/apps.py"
        - "enterprise/backend/enterprise_core/apps.py"

sidecars_and_tools:
