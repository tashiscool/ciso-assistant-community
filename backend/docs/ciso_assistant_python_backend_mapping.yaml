        viewset: "TaskNodeViewSet"
        model: "core.TaskNode"
      - route: "terminologies"
        viewset: "TerminologyViewSet"
        model: "core.Terminology"
      - route: "preset-journeys"
        viewset: "PresetJourneyViewSet"
        model: "core.PresetJourney"
      - route: "preset-journey-steps"
        viewset: "PresetJourneyStepViewSet"
        model: "core.PresetJourneyStep"
      - route: "client-settings"
        viewset: "enterprise_core.views.ClientSettingsViewSet"
        model: "enterprise_core.ClientSettings"
        source: "enterprise dynamic ROUTES"
      - route: "custom-email-templates"
        viewset: "enterprise_core.views.CustomEmailTemplateViewSet"
        model: "core.CustomEmailTemplate"
        source: "enterprise dynamic ROUTES"
      - route: "custom-word-templates"
        viewset: "enterprise_core.views.CustomWordTemplateViewSet"
        model: "core.CustomWordTemplate"
        source: "enterprise dynamic ROUTES"
