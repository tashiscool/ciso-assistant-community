    - "PBKDF2PasswordHasher"
    - "PBKDF2SHA1PasswordHasher"
    - "BCryptSHA256PasswordHasher"
    - "ScryptPasswordHasher"

known_architecture_notes:
  - "The primary API is mounted under /api/ and most business endpoints are DRF ViewSets registered in core.urls."
  - "Enterprise routes augment the community route registry through settings.ROUTES and settings.MODULES rather than replacing core.urls."
  - "The backend is single-instance/folder-scoped rather than tenant-slug-scoped; folder/domain hierarchy is the main authorization boundary."
  - "SQLite is first-class for local/container deployments, with PostgreSQL enabled by environment variables."
  - "Attachments are stored through Django default_storage, allowing either local files or S3-compatible object storage."
  - "Chat/RAG is dormant unless ENABLE_CHAT and the chat feature flag are enabled."
  - "Sidecar Python packages are operational tooling around the API, not Django apps loaded into INSTALLED_APPS."
