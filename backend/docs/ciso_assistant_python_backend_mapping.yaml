  local_checks:
    yaml_parse: "ruby -e 'require \"yaml\"; YAML.load_file(\"backend/docs/ciso_assistant_python_backend_mapping.yaml\")'"
    django_check: "cd backend && poetry run python manage.py check"
    backend_tests: "cd backend && poetry run pytest"
    dispatcher_tests: "cd dispatcher && uv run pytest"
    cli_tests: "cd cli && pytest"
  source_cross_checks:
    - "Every router.register route in backend/*/urls.py and enterprise/backend/*/urls.py is represented in api_map."
    - "Every Django model class discovered in backend/*/models.py and enterprise/backend/*/models.py is represented under domain_apps or supporting model notes."
    - "Every Huey-decorated task in backend/*/tasks.py is represented under background_processing."

