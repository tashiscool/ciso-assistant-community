      - "/api/serdes/"
      - "/serdes/"
    source: "backend/serdes/urls.py"
    endpoints:
      - "dump-db/"
      - "load-backup/"
      - "full-restore/"
      - "attachment-metadata/"
      - "batch-download-attachments/"
      - "batch-upload-attachments/"
  data_wizard:
    base_path: "/api/data-wizard/"
    source: "backend/data_wizard/urls.py"
    endpoints:
      - "load-file/"
    purpose: "Excel/CSV import wizard for assets, users, folders, perimeters, assessments, libraries, privacy, TPRM, EBIOS, and BIA templates."
  chat:
    base_path: "/api/chat/"
    source: "backend/chat/urls.py"
    enabled_by: "ENABLE_CHAT=true plus settings feature flag"
    router_viewsets:
      - "sessions -> ChatSessionViewSet"
      - "documents -> IndexedDocumentViewSet"
    direct_endpoints:
      - "status/"
      - "ollama-models/"
  ebios_rm:
    base_path: "/api/ebios-rm/"
    source: "backend/ebios_rm/urls.py"
    router_viewsets:
      - "studies -> EbiosRMStudyViewSet"
      - "feared-events -> FearedEventViewSet"
      - "ro-to -> RoToViewSet"
      - "stakeholders -> StakeholderViewSet"
      - "strategic-scenarios -> StrategicScenarioViewSet"
      - "attack-paths -> AttackPathViewSet"
      - "operational-scenarios -> OperationalScenarioViewSet"
      - "elementary-actions -> ElementaryActionViewSet"
      - "operating-modes -> OperatingModeViewSet"
      - "kill-chains -> KillChainViewSet"
  privacy:
    base_path: "/api/privacy/"
    source: "backend/privacy/urls.py"
    router_viewsets:
      - "purposes -> PurposeViewSet"
      - "personal-data -> PersonalDataViewSet"
      - "data-subjects -> DataSubjectViewSet"
      - "data-recipients -> DataRecipientViewSet"
      - "data-contractors -> DataContractorViewSet"
      - "data-transfers -> DataTransferViewSet"
      - "processings -> ProcessingViewSet"
      - "processing-natures -> ProcessingNatureViewSet"
      - "right-requests -> RightRequestViewSet"
      - "data-breaches -> DataBreachViewSet"
  resilience:
    base_path: "/api/resilience/"
    source: "backend/resilience/urls.py"
    router_viewsets:
      - "business-impact-analysis -> BusinessImpactAnalysisViewSet"
      - "asset-assessments -> AssetAssessmentViewSet"
      - "escalation-thresholds -> EscalationThresholdViewSet"
  crq:
    base_path: "/api/crq/"
    source: "backend/crq/urls.py"
    router_viewsets:
      - "quantitative-risk-studies -> QuantitativeRiskStudyViewSet"
      - "quantitative-risk-scenarios -> QuantitativeRiskScenarioViewSet"
      - "quantitative-risk-hypotheses -> QuantitativeRiskHypothesisViewSet"
    direct_endpoints:
      - "quantitative-risk-studies/<uuid:pk>/action-plan/"
      - "quantitative-risk-studies/<uuid:pk>/action-plan/budget-overview/"
  pmbok:
    base_path: "/api/pmbok/"
    source: "backend/pmbok/urls.py"
    router_viewsets:
      - "generic-collections -> GenericCollectionViewSet"
      - "accreditations -> AccreditationViewSet"
  metrology:
    base_path: "/api/metrology/"
    source: "backend/metrology/urls.py"
    router_viewsets:
      - "metric-definitions -> MetricDefinitionViewSet"
