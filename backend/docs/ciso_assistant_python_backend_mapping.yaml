    path: "dispatcher/"
    package: "ciso-assistant-dispatcher"
    purpose: "Kafka-compatible message dispatcher that consumes observation messages and calls CISO Assistant REST API actions."
    entrypoint: "dispatcher/dispatcher.py"
    config_sources:
      - "environment variables"
      - ".dispatcher_config"
      - "init-config command"
    external_services:
      - "Kafka or Redpanda"
      - "CISO Assistant REST API"
      - "optional S3-compatible object store"
    auth_modes:
      - "personal access token via USER_TOKEN"
      - "email/password with optional AUTO_RENEW_SESSION"
    message_domains:
      - "update_applied_control"
      - "update_requirement_assessment"
      - "evidence/file upload style dispatch"
      - "errors topic routing"
  cli:
    path: "cli/"
    package: "ciso-assistant-cli"
    purpose: "Command-line API client and MCP server for imports, reads, updates, evidence uploads, backups, restore, and analysis workflows."
    entrypoints:
      - "cli/clica.py"
      - "cli/ca_mcp/server.py"
    auth: "Personal Access Token via TOKEN/API_URL/VERIFY_CERTIFICATE"
    main_command_groups:
      - "folder/perimeter/risk matrix discovery"
      - "Data Wizard imports"
      - "evidence attachment upload"
      - "full backup and restore"
      - "MCP read/write/update/library/tprm/ebios/risk analysis tools"
  automation:
    path: "automation/"
    package: "automation"
    purpose: "Prefect-based security scan ETL, currently Prowler-oriented."
    flow: "scan_etl_pipeline"
    tasks:
      - "extract_config"
      - "create_tmp_config_files"
      - "run_prowler_scan"
      - "transform_results"
      - "match_framework_urn"
      - "update_audit"
      - "delete_tmp_files"
  tools:
    path: "tools/"
    purpose: "Framework/library conversion, mappings, Excel/YAML transformations, semantic mapping helpers, and data preparation scripts."
