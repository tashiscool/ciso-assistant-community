semantic_parity_guidance_for_regovise:
  requirement: "Implement tenant-facing, discoverable, operable equivalents rather than cloning private RegScale internals."
  minimum_backend_equivalents:
    - "Tenant identity, roles, SSO, service accounts, module/feature flags, and setup configuration."
    - "Generic module-record CRUD with standardized subsystems."
    - "Form Builder metadata plus live rule evaluation and API-side validation."
    - "Export, Report, Dashboard, Questionnaire, and Wayfinder builders wired to module metadata and records."
    - "Questionnaire runtime with assignments, access codes, scoring, feedback, exports, flattened reporting data, and cleanup-safe delete."
    - "Automation Manager connector lifecycle with credential metadata, schedules, dry-run/test, sync status, and errors."
    - "AI/RegML-equivalent paths with deterministic fallback labeling when AI is unavailable."
    - "Compliance catalogs, security controls, security plans, evidence, exports, workbench, dashboards, search, reports, and audit history."
