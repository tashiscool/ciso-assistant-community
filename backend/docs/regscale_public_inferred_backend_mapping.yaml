schema_version: "1.0"
document:
  title: "RegScale Publicly Inferred Backend Mapping"
  generated_on: "2026-06-01"
  repository_context: "ciso-assistant-community"
  purpose: >
    Machine-readable backend map for RegScale based only on public RegScale
    website, documentation, documentation index, and API reference material.
    This file separates directly documented facts from inferred backend
    responsibilities so it can be used for semantic parity planning without
    implying access to RegScale private source code or infrastructure.
  scope:
    includes:
      - "Publicly documented deployment/runtime architecture"
      - "Publicly documented authentication, tenant, setup, and service-account surfaces"
      - "Publicly documented module inventory"
      - "Publicly documented builder, automation, AI, export, workflow, and subsystem semantics"
      - "Publicly documented API examples and likely API resource families"
      - "Inferred backend service responsibilities and entity families"
    excludes:
      - "Private source code"
      - "Private database schema details not documented publicly"
      - "Private queue, object-storage, observability, and hosting provider internals"
      - "Customer-specific RegScale configuration"
  confidence_legend:
    high: "Directly stated by a cited RegScale public source."
    medium: "Strongly implied by multiple public sources or by named API/entity/service surfaces."
    low: "Reasonable architecture inference, but not directly documented by public sources."
  safety_notes:
    - "Use this as an external semantic map, not as authoritative RegScale internals."
    - "Do not copy proprietary behavior; implement equivalent tenant-facing capabilities independently."
    - "All source anchors are public RegScale domains as of the generated date."

